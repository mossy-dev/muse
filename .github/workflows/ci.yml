name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same three gates the justfile runs, on every platform muse claims to
  # support. The odin commands are spelled out rather than driven through just,
  # so the workflow needs nothing installed beyond the compiler.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-odin

      - name: Build
        run: odin build src/cli -debug -out:build

      - name: Test the library
        run: odin test src/muse

      - name: Test the CLI
        run: odin test src/cli

      - name: Run the transcript
        run: ./tests/transcript.sh

      # The page is generated from the binary, so a broken generator is a broken
      # release. groff is asked for warnings and told not to render anything.
      - name: Generate and check the man page
        run: |
          set -euo pipefail
          ./tools/manpage.sh build > muse.1
          grep -q '^\.TH MUSE 1' muse.1
          grep -q 'muse scale G major' muse.1
          if command -v groff > /dev/null; then
            groff -man -Tutf8 -ww -z muse.1
          fi
